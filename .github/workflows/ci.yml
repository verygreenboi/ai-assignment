name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_docs
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every check runs even when an earlier one fails, so a red run reports
      # all of its failures at once instead of only the first. The job still
      # fails if any single step fails.
      - run: npm run lint
        if: ${{ !cancelled() }}

      - run: npm run typecheck
        if: ${{ !cancelled() }}

      - run: npm run test
        if: ${{ !cancelled() }}

      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}

      - run: npm run test:e2e
        if: ${{ !cancelled() }}
