name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    # The service below maps 5433:5432 and every step runs on the runner host,
    # so `localhost:5433` is what the steps see — identical to `.env.example`.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/collab_docs

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_docs
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s
          --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Draft PRs are this epic's deliberate red push: run every check so the
      # run shows exactly which assertions failed. A red that stopped at the
      # first failing step proves nothing about the checks it skipped, and for
      # children whose primary guard is the E2E suite that is the whole point.
      # Ready-for-review PRs and pushes fail fast on the first error.
      # Do not "simplify" this away, and never use continue-on-error — that
      # would mark failing steps green at the job level and destroy the gate.
      - run: npm run typecheck
        if: ${{ success() || (!cancelled() && github.event.pull_request.draft) }}

      # Carries the same condition as its neighbours on purpose: without it a
      # draft red with an earlier failure would skip migrate entirely, leaving
      # every later child's red run to fail on an empty database instead of on
      # its own assertions.
      - run: npm run db:migrate && npm run db:seed
        if: ${{ success() || (!cancelled() && github.event.pull_request.draft) }}

      - run: npm run test
        if: ${{ success() || (!cancelled() && github.event.pull_request.draft) }}

      - run: npx playwright install --with-deps chromium
        if: ${{ success() || (!cancelled() && github.event.pull_request.draft) }}

      - run: npm run test:e2e
        if: ${{ success() || (!cancelled() && github.event.pull_request.draft) }}
