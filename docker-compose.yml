services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collab_docs
    ports:
      - "5433:5432"
    volumes:
      - collab-docs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collab-docs-pgdata:
